# CustomGUIs Configuration
# -------------------------
# Define your custom inventory GUIs below.
#
# Each GUI entry supports:
#   command:  The in-game command that opens this GUI (without the slash).
#   title:    The inventory title. Supports & color codes and #RRGGBB hex colors.
#   size:     Number of slots (9, 18, 27, 36, 45, or 54).
#   readonly: If true, players cannot move items in/out of the GUI.
#   items:    A map of slot numbers (0-based) to item definitions.
#
# Item definition fields:
#   material: A valid Minecraft material name (e.g. DIAMOND_SWORD, PAPER).
#   name:     Display name. Supports & color codes and #RRGGBB hex colors.
#   lore:     A list of lore lines. Supports color codes.
#   command:  (Optional) A command executed by the player when they click this item.
#             Do NOT include the leading slash.
#
# Permissions:
#   customguis.admin  - Required to use /cgu reload
#   (GUI commands have no permission by default; add them in your permissions plugin)
#
# Reload without restart: /cgu reload
# -------------------------

guis:

